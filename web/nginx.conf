server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  # __API_ORIGIN__ is filled from VITE_API_URL at image build; inline styles are MUI/emotion's
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' __API_ORIGIN__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # expires (not add_header) so the server-level security headers above still apply
  location /assets/ { expires 1y; }
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
